<style>
  html,body { height:100%; margin:0; }
  #app { display:flex; height:100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #graph { flex: 1 1 60%; min-width:0; height:100vh; }

<div id="app">
  <div id="graph"></div>
  <div id="side">
    <h2 id="side-title">Select a book node to view highlights</h2>
    <div id="meta" class="muted"></div>
    <table id="hl-table" style="display:none;">
      <thead><tr><th style="width:70%;">Highlight</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
  const HIGHLIGHTS = {"https://your.name/kg/book/fd08e7a2113c": [{"text": "A big red flag in many workplace cultures is a sense of entitlement. We always sought low maintenance, low drama personalities. We valued traits such as strong task ownership, a sense of urgency, and a \u201cno excuses\u201d mentality. People who get things done rather than explain why they can't. This personality type lines up with our obsession with hiring drivers rather than passengers, as we saw in an earlier chapter.", "id": "https://your.name/kg/highlight/fd08e7a2113c#h-bb87c549"}], "https://your.name/kg/book/b6b9bc8d3759": [{"text": "Larry doesn\u2019t demand endless work reports as long as you\u2019re doing the job and you don\u2019t fuck it up. . . .", "id": "https://your.name/kg/highlight/b6b9bc8d3759#h-ea9ff8a8"}], "https://your.name/kg/book/98dd6e4e6135": [{"text": "Comradery is dangerous. It makes it hard for people to challenge each other\u2019s work. There is a tendency to not want to throw a colleague under the bus. That needs to be avoided.", "id": "https://your.name/kg/highlight/98dd6e4e6135#h-a60a0e65"}], "https://your.name/kg/book/6eef6d8ad0cd": [{"text": "It's not just business-related expenses. You also have to create an environment that you like so that people are happy and feel they are valued.", "id": "https://your.name/kg/highlight/6eef6d8ad0cd#h-0b0b73f3"}, {"text": "You have to make sure that you keep on the uptick\u2014not just financially, but also make it so that it's a fun environment and people want to work there.", "id": "https://your.name/kg/highlight/6eef6d8ad0cd#h-b5a2cce0"}], "https://your.name/kg/book/4fe5cd1bd907": [{"text": "Decentralized decision making. Emphasizing quality of work over quality of wardrobe.", "id": "https://your.name/kg/highlight/4fe5cd1bd907#h-c8d30c95"}]};

  function renderForBook(bookId, bookLabel) {
    const tbl = document.getElementById('hl-table');
    const tbody = tbl.querySelector('tbody');
    tbody.innerHTML = '';
    const rows = HIGHLIGHTS[bookId] || [];
    document.getElementById('side-title').textContent = bookLabel || 'Highlights';
    document.getElementById('meta').textContent = rows.length ? (rows.length + ' highlights') : 'No highlights';
    if (!rows.length) { tbl.style.display='none'; return; }
    for (const r of rows) {
      const tr = document.createElement('tr');
      const tdText = document.createElement('td');
      tdText.textContent = r.text.length > 300 ? r.text.slice(0,300) + '…' : r.text;
      tr.appendChild(tdText);
      tbody.appendChild(tr);
    }
    tbl.style.display = '';
  }

  // After pyvis initializes window.network & #mynetwork, mount two-pane and move the canvas.
  (function waitNet(){
    const netDiv = document.getElementById('mynetwork');
    if (!netDiv || !window.network) return setTimeout(waitNet, 30);

    // Build two-pane and move #mynetwork into #graph
    const graph = document.querySelector('#graph');
    graph.appendChild(netDiv);

    // Ensure sizes
    netDiv.style.width  = '100%';
    netDiv.style.height = '100%';

    // Redraw to fit new container
    try { network.redraw(); network.fit(); } catch(e) {}

    // Click to populate table
    network.on('selectNode', function(params){
      const id = params.nodes[0];
      if (id && HIGHLIGHTS[id]) {
        let label = id;
        try {
          const n = network.body.data.nodes.get(id);
          label = (n && n.title) ? n.title : (n && n.label) ? n.label : id;
        } catch(e) {}
        renderForBook(id, label);
      }
    });

    // Auto-select the book with most mentions
    const ids = Object.keys(HIGHLIGHTS);
    if (ids.length) {
      const best = ids.map(id => [id, HIGHLIGHTS[id].length]).sort((a,b)=>b[1]-a[1])[0][0];
      try {
        const n = network.body.data.nodes.get(best);
        const label = (n && n.title) ? n.title : (n && n.label) ? n.label : best;
        renderForBook(best, label);
        network.selectNodes([best]);
      } catch(e) {}
    }

    // Resize handling
    window.addEventListener('resize', function(){
      try { network.redraw(); network.fit(); } catch(e) {}
    });
  })();
</script>

        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#8e63c7", "id": "https://your.name/kg/concept/workplace-culture", "label": "Workplace Culture", "shape": "dot", "size": 20, "title": "Workplace Culture"}, {"color": "#4e79a7", "id": "https://your.name/kg/book/fd08e7a2113c", "label": "Amp It Up: Leading for Hypergrowth by Raising Expectations, \u2026", "shape": "dot", "title": "Amp It Up: Leading for Hypergrowth by Raising Expectations, Increasing Urgency, and Elevating Intensity"}, {"color": "#4e79a7", "id": "https://your.name/kg/book/b6b9bc8d3759", "label": "Softwar: An Intimate Portrait of Larry Ellison and Oracle", "shape": "dot", "title": "Softwar: An Intimate Portrait of Larry Ellison and Oracle"}, {"color": "#4e79a7", "id": "https://your.name/kg/book/98dd6e4e6135", "label": "Elon Musk", "shape": "dot", "title": "Elon Musk"}, {"color": "#4e79a7", "id": "https://your.name/kg/book/6eef6d8ad0cd", "label": "Founders at Work: Stories of Startups\u0027 Early Days", "shape": "dot", "title": "Founders at Work: Stories of Startups\u0027 Early Days"}, {"color": "#4e79a7", "id": "https://your.name/kg/book/4fe5cd1bd907", "label": "Hackers: Heroes of the Computer Revolution - 25th Anniversar\u2026", "shape": "dot", "title": "Hackers: Heroes of the Computer Revolution - 25th Anniversary Edition"}]);
                  edges = new vis.DataSet([{"from": "https://your.name/kg/concept/workplace-culture", "to": "https://your.name/kg/book/fd08e7a2113c", "value": 1}, {"from": "https://your.name/kg/concept/workplace-culture", "to": "https://your.name/kg/book/b6b9bc8d3759", "value": 1}, {"from": "https://your.name/kg/concept/workplace-culture", "to": "https://your.name/kg/book/98dd6e4e6135", "value": 1}, {"from": "https://your.name/kg/concept/workplace-culture", "to": "https://your.name/kg/book/6eef6d8ad0cd", "value": 2}, {"from": "https://your.name/kg/concept/workplace-culture", "to": "https://your.name/kg/book/4fe5cd1bd907", "value": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.25,
            "damping": 0.09,
            "gravitationalConstant": -22000,
            "springConstant": 0.02,
            "springLength": 140
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
